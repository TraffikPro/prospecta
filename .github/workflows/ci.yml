name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.21.1
  PNPM_VERSION: 9.15.9

jobs:
  tests:
    name: Tests (PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/prospecta_ci
      AUTH_SECRET: ci-placeholder-ci-placeholder-ci-placeholder
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      EMAIL_PROVIDER: console
      NODE_ENV: test
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
      RATE_LIMIT_KEY_SECRET: ""
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: prospecta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d prospecta_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Guard ephemeral database target
        run: >-
          pnpm exec tsx -e
          'import { assertSafeForMutableTestsOrThrow } from "./src/lib/safety/production-mutation-guard";
          const databaseUrl = process.env.DATABASE_URL;
          if (!databaseUrl || new URL(databaseUrl).hostname !== "127.0.0.1")
          throw new Error("CI database must use 127.0.0.1");
          assertSafeForMutableTestsOrThrow({ databaseUrl });
          console.log("CI database guard accepted ephemeral localhost");'

      - name: Apply existing migrations to ephemeral PostgreSQL
        run: pnpm prisma:deploy

      - name: Run complete test suite serially
        run: pnpm exec tsx --test --test-concurrency=1 src/**/*.test.ts

  quality:
    name: Quality (lint, typecheck, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:9/prospecta_ci_build
      AUTH_SECRET: ci-placeholder-ci-placeholder-ci-placeholder
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      EMAIL_PROVIDER: console
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
      RATE_LIMIT_KEY_SECRET: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build without external services
        run: pnpm build
